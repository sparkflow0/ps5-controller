<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إتمام الشراء – EZ GAMING</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #151515;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    button,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent !important;
    }

    body {
      margin: 0;
      font-family: "Cairo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #05060b 0, #020308 50%, #000 100%);
      color: #fff;
      overflow-x: hidden;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      display: block;
    }

    button {
      border: none;
      background: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    /* ---------- TOP NAVBAR ---------- */

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 50;
      background: radial-gradient(circle at top,
        rgba(10, 12, 20, 0.98),
        rgba(0, 0, 0, 0.96));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
    }

    .nav-logo {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .nav-logo-mark {
      width: 160px;
      height: 40px;
      background-image: url("logo.png");
      background-repeat: no-repeat;
      background-size: contain;
      background-position: right;
    }

    .nav-page-title {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .nav-summary {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-amount-block {
      text-align: start;
    }

    .nav-amount-label {
      font-size: 0.75rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .nav-amount-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Language toggle */
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 999px;
      background: radial-gradient(circle at top,
          rgba(255, 255, 255, 0.06),
          rgba(0, 0, 0, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.85);
      gap: 3px;
    }

    .lang-btn {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.7);
      background: transparent;
      font-weight: 800;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, lawngreen, rgb(68, 129, 7));
      color: #0b1020;
      box-shadow:
        0 10px 20px rgba(0, 0, 0, 1),
        0 0 14px rgba(0, 229, 255, 0.9);
    }

    .lang-btn.active:hover {
      transform: translateY(-1px);
    }

    /* ---------- LAYOUT ---------- */

    .page-content {
      padding-top: 70px;
      padding-bottom: 24px;
    }

    .checkout-layout {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);
      gap: 18px;
    }

    .card {
      background: radial-gradient(circle at top,
          rgba(255, 255, 255, 0.06),
          rgba(4, 4, 4, 0.98));
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 1),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 14px 16px 16px;
    }

    .card-title {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    /* ---------- FORM ---------- */

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.85rem;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    input,
    select,
    textarea {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(3, 3, 8, 0.95);
      padding: 7px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(0, 229, 255, 0.7);
      box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.5);
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .terms-row {
      margin-top: 6px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .place-order-btn {
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      color: #000000;
      font-size: 0.9rem;
      background: linear-gradient(135deg, lawngreen, rgb(68, 129, 7));
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.9),
        0 0 18px rgba(0, 229, 255, 0.7);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    .place-order-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 1),
        0 0 24px rgba(0, 229, 255, 0.9);
      filter: brightness(1.1);
    }

    .place-order-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.8),
        0 0 14px rgba(0, 229, 255, 0.7);
    }

    /* ---------- ORDER SUMMARY ---------- */

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .summary-row.total {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 700;
    }

    .summary-row small {
      opacity: 0.7;
    }

    .summary-hr {
      height: 1px;
      border: none;
      margin: 8px 0;
      background: linear-gradient(to right,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.22),
        rgba(255, 255, 255, 0));
    }

    .summary-items-list {
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .summary-item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .summary-item-name {
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 900px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .form-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="nav-logo">
      <a href="index.html" class="nav-left">
        <div class="nav-logo-mark"></div>
        <div class="nav-page-title" data-i18n="checkoutTitle">إتمام الشراء</div>
      </a>
    </div>
    <div class="nav-summary">
      <div class="lang-toggle" id="langToggle">
        <button class="lang-btn" data-lang="ar">ع</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <div class="nav-amount-block">
        <div class="nav-amount-label" data-i18n="totalLabel">الإجمالي</div>
        <div class="nav-amount-value" id="navTotal">د.ب 0.00</div>
      </div>
    </div>
  </div>

  <!-- PAGE CONTENT -->
  <div class="page-content">
    <div class="checkout-layout">
      <!-- LEFT: FORM -->
      <div class="card">
        <div class="card-title" data-i18n="formTitle">بيانات العميل والدفع</div>
        <form id="checkoutForm">
          <div class="form-row">
            <div class="form-field">
              <label for="fullName" data-i18n="fullNameLabel">الاسم الكامل *</label>
              <input id="fullName" name="fullName" required />
            </div>
            <div class="form-field">
              <label for="phone" data-i18n="phoneLabel">رقم الهاتف *</label>
              <input id="phone" name="phone" type="tel" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="email" data-i18n="emailLabel">البريد الإلكتروني *</label>
              <input id="email" name="email" type="email" required />
            </div>
            <div class="form-field">
              <label for="country" data-i18n="countryLabel">الدولة *</label>
              <input id="country" name="country" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="city" data-i18n="cityLabel">المدينة *</label>
              <input id="city" name="city" required />
            </div>
            <div class="form-field">
              <label for="postalCode" data-i18n="postalCodeLabel">الرمز البريدي (اختياري)</label>
              <input id="postalCode" name="postalCode" />
            </div>
          </div>

          <div class="form-field">
            <label for="address" data-i18n="addressLabel">العنوان التفصيلي *</label>
            <textarea id="address" name="address" required></textarea>
          </div>

          <div class="form-field">
            <label for="shippingMethod" data-i18n="shippingMethodLabel">طريقة الشحن</label>
            <select id="shippingMethod" name="shippingMethod">
              <option value="standard" data-i18n="shippingStandard">شحن عادي (3–5 أيام)</option>
              <option value="express" data-i18n="shippingExpress">شحن سريع (1–2 يوم)</option>
              <option value="pickup" data-i18n="shippingPickup">استلام من المتجر</option>
            </select>
          </div>

          <div class="form-field">
            <label data-i18n="paymentMethodsTitle">طريقة الدفع (للتجربة فقط – بدون تنفيذ الدفع الفعلي)</label>
            <div class="payment-methods">
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="card" checked />
                <span data-i18n="paymentCard">بطاقة ائتمانية / مدى</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="online" />
                <span data-i18n="paymentOnline">بوابة دفع إلكترونية</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="cod" />
                <span data-i18n="paymentCod">الدفع عند الاستلام (إن توفر)</span>
              </label>
            </div>
          </div>

          <div class="terms-row">
            <input type="checkbox" id="agree" required />
            <label for="agree" data-i18n="termsText">
              أقر بأن جميع بيانات التخصيص صحيحة، وأوافق على الشروط والأحكام وسياسة الاستبدال.
            </label>
          </div>

          <button type="submit" class="place-order-btn" data-i18n="placeOrderBtn">
            تأكيد الطلب (بدون دفع)
          </button>
        </form>
      </div>

      <!-- RIGHT: ORDER SUMMARY -->
      <div class="card">
        <div class="card-title" data-i18n="summaryTitle">ملخص الطلب</div>
        <div id="summaryEmpty" style="font-size:0.85rem; opacity:0.8; margin-bottom:8px; display:none;"
             data-i18n="summaryEmpty">
          لا توجد عناصر في السلة. يرجى العودة إلى صفحة التخصيص.
        </div>

        <div id="summaryItemsList" class="summary-items-list"></div>

        <hr class="summary-hr" />

        <div class="summary-row">
          <div data-i18n="itemsCountLabel">عدد القطع</div>
          <div id="summaryItemsCount">0</div>
        </div>
        <div class="summary-row">
          <div data-i18n="subtotalLabel">الإجمالي الفرعي</div>
          <div id="summarySubtotal">د.ب 0.00</div>
        </div>
        <div class="summary-row">
          <div data-i18n="shippingLabel">الشحن</div>
          <div><small data-i18n="shippingSummaryNote">سيتم حسابه حسب العنوان وطريقة الشحن</small></div>
        </div>
        <div class="summary-row total">
          <div data-i18n="totalDueLabel">الإجمالي المستحق (بدون رسوم الدفع)</div>
          <div id="summaryTotal">د.ب 0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CART_KEY = "ezCart";

    const i18n = {
      ar: {
        checkoutTitle: "إتمام الشراء",
        totalLabel: "الإجمالي",
        formTitle: "بيانات العميل والدفع",
        fullNameLabel: "الاسم الكامل *",
        phoneLabel: "رقم الهاتف *",
        emailLabel: "البريد الإلكتروني *",
        countryLabel: "الدولة *",
        cityLabel: "المدينة *",
        postalCodeLabel: "الرمز البريدي (اختياري)",
        addressLabel: "العنوان التفصيلي *",
        shippingMethodLabel: "طريقة الشحن",
        shippingStandard: "شحن عادي (3–5 أيام)",
        shippingExpress: "شحن سريع (1–2 يوم)",
        shippingPickup: "استلام من المتجر",
        paymentMethodsTitle: "طريقة الدفع (للتجربة فقط – بدون تنفيذ الدفع الفعلي)",
        paymentCard: "بطاقة ائتمانية / مدى",
        paymentOnline: "بوابة دفع إلكترونية",
        paymentCod: "الدفع عند الاستلام (إن توفر)",
        termsText: "أقر بأن جميع بيانات التخصيص صحيحة، وأوافق على الشروط والأحكام وسياسة الاستبدال.",
        placeOrderBtn: "تأكيد الطلب (بدون دفع)",
        summaryTitle: "ملخص الطلب",
        summaryEmpty: "لا توجد عناصر في السلة. يرجى العودة إلى صفحة التخصيص.",
        itemsCountLabel: "عدد القطع",
        subtotalLabel: "الإجمالي الفرعي",
        shippingLabel: "الشحن",
        shippingSummaryNote: "سيتم حسابه حسب العنوان وطريقة الشحن",
        totalDueLabel: "الإجمالي المستحق (بدون رسوم الدفع)",
        currencyPrefix: "د.ب ",
        alertNoItems: "لا توجد عناصر في السلة لإتمام الطلب.",
        formSuccess: "تم حفظ تفاصيل الطلب (تجريبياً). يمكنك الآن ربط هذه الصفحة ببوابة الدفع الحقيقية لاحقًا."
      },
      en: {
        checkoutTitle: "Checkout",
        totalLabel: "Total",
        formTitle: "Customer & payment details",
        fullNameLabel: "Full name *",
        phoneLabel: "Phone *",
        emailLabel: "Email *",
        countryLabel: "Country *",
        cityLabel: "City *",
        postalCodeLabel: "Postal code (optional)",
        addressLabel: "Full address *",
        shippingMethodLabel: "Shipping method",
        shippingStandard: "Standard shipping (3–5 days)",
        shippingExpress: "Express shipping (1–2 days)",
        shippingPickup: "Store pickup",
        paymentMethodsTitle: "Payment method (demo only – no real charge)",
        paymentCard: "Credit / debit card",
        paymentOnline: "Online payment gateway",
        paymentCod: "Cash on delivery (if available)",
        termsText: "I confirm all customization details are correct and agree to the terms & conditions.",
        placeOrderBtn: "Confirm order (no payment)",
        summaryTitle: "Order summary",
        summaryEmpty: "Your cart is empty. Please go back to the configurator.",
        itemsCountLabel: "Items",
        subtotalLabel: "Subtotal",
        shippingLabel: "Shipping",
        shippingSummaryNote: "Will be calculated based on address and method",
        totalDueLabel: "Total due (excluding gateway fees)",
        currencyPrefix: "BHD ",
        alertNoItems: "There are no items in the cart to place an order.",
        formSuccess: "Order details saved (demo). You can now connect this page to a real payment gateway later."
      }
    };

    let currentLang = localStorage.getItem("ez_lang") || "ar";

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || key;
    }

    function formatMoney(value) {
      const prefix = i18n[currentLang].currencyPrefix || "";
      return prefix + value.toFixed(2);
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
      });

      // options text
      document.querySelectorAll("option[data-i18n]").forEach(opt => {
        const key = opt.getAttribute("data-i18n");
        if (i18n[currentLang][key]) opt.textContent = i18n[currentLang][key];
      });

      renderSummary();
    }

    document.getElementById("langToggle").addEventListener("click", (e) => {
      const btn = e.target.closest(".lang-btn");
      if (!btn) return;
      const lang = btn.dataset.lang;
      if (!lang || lang === currentLang) return;
      currentLang = lang;
      localStorage.setItem("ez_lang", currentLang);
      applyLanguage();
    });

    const navTotalEl = document.getElementById("navTotal");
    const summaryItemsListEl = document.getElementById("summaryItemsList");
    const summaryItemsCountEl = document.getElementById("summaryItemsCount");
    const summarySubtotalEl = document.getElementById("summarySubtotal");
    const summaryTotalEl = document.getElementById("summaryTotal");
    const summaryEmptyEl = document.getElementById("summaryEmpty");
    const checkoutForm = document.getElementById("checkoutForm");

    function loadCart() {
      try {
        const raw = localStorage.getItem(CART_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    const cartItems = loadCart();

    function computeCartTotals() {
      let total = 0;
      let count = 0;
      for (const item of cartItems) {
        count += item.quantity;
        total += item.unitPrice * item.quantity;
      }
      return { total, count };
    }

    function renderSummary() {
      summaryItemsListEl.innerHTML = "";

      if (!cartItems.length) {
        summaryEmptyEl.style.display = "block";
        summaryEmptyEl.textContent = t("summaryEmpty");
      } else {
        summaryEmptyEl.style.display = "none";
      }

      cartItems.forEach(item => {
        const row = document.createElement("div");
        row.className = "summary-item-row";

        const nameEl = document.createElement("div");
        nameEl.className = "summary-item-name";
        const name = item.name || (currentLang === "ar" ? "متحكم PS5 مخصّص" : "Custom PS5 Controller");
        nameEl.textContent = name + " × " + item.quantity;

        const priceEl = document.createElement("div");
        const lineTotal = item.unitPrice * item.quantity;
        priceEl.textContent = formatMoney(lineTotal);

        row.appendChild(nameEl);
        row.appendChild(priceEl);
        summaryItemsListEl.appendChild(row);
      });

      const { total, count } = computeCartTotals();
      navTotalEl.textContent = formatMoney(total);
      summaryItemsCountEl.textContent = count;
      summarySubtotalEl.textContent = formatMoney(total);
      summaryTotalEl.textContent = formatMoney(total);
    }

    checkoutForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!cartItems.length) {
        alert(t("alertNoItems"));
        return;
      }

      const formData = new FormData(checkoutForm);
      const data = Object.fromEntries(formData.entries());
      data.agree = document.getElementById("agree").checked;
      data.cart = cartItems;

      console.log("Checkout data (demo):", data);
      alert(t("formSuccess"));
    });

    // init
    applyLanguage();
  </script>
</body>
</html>
